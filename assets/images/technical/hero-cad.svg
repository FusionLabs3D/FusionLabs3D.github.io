<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="isoGrid" width="30" height="51.96" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 30 17.32 L 0 34.64 L 0 51.96 M 30 0 L 0 17.32 L 30 34.64 L 30 51.96" stroke="#ECEFF1" stroke-width="0.75" fill="none" />
    </pattern>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF5000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Isometric Blueprint Grid Background -->
  <rect width="680" height="500" fill="url(#isoGrid)" />
  <rect x="16" y="16" width="648" height="468" stroke="#E2E8F0" stroke-width="1" fill="none" rx="4"/>
  
  <!-- Technical Header Tag -->
  <g transform="translate(36, 42)">
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#94A3B8" stroke-width="1"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#94A3B8" stroke-width="1"/>
    <text x="18" y="2" font-family="'Space Grotesk', 'Courier New', monospace" font-size="11" font-weight="700" fill="#0F172A" letter-spacing="0.5">CAD: FL3D-DRONE-X5.STEP</text>
    <text x="18" y="16" font-family="'Space Grotesk', 'Courier New', monospace" font-size="10" fill="#64748B">220mm FPV QUADCOPTER CHASSIS | PA6-CF COMPOSITE</text>
  </g>

  <!-- Ground Optical Shadow -->
  <ellipse cx="340" cy="410" rx="240" ry="45" fill="url(#orangeGlow)"/>

  <!-- Dimension line: Motor-to-Motor Diagonal -->
  <g stroke="#94A3B8" stroke-width="1" stroke-linecap="round">
    <line x1="120" y1="120" x2="560" y2="120" stroke-dasharray="4,4"/>
    <line x1="120" y1="112" x2="120" y2="160" />
    <line x1="560" y1="112" x2="560" y2="350" />
    <polyline points="126,117 120,120 126,123" fill="none"/>
    <polyline points="554,117 560,120 554,123" fill="none"/>
    <text x="340" y="112" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" fill="#FF5000" text-anchor="middle">MOTOR DIAGONAL: 220.00 mm</text>
  </g>

  <!-- Dimension line: Arm Thickness -->
  <g stroke="#94A3B8" stroke-width="1" stroke-linecap="round">
    <line x1="600" y1="330" x2="600" y2="352" />
    <line x1="592" y1="330" x2="608" y2="330" />
    <line x1="592" y1="352" x2="608" y2="352" />
    <text x="614" y="344" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#FF5000" dominant-baseline="middle">THICKNESS: 5.0 mm</text>
  </g>

  <!-- DRONE FRAME 3D ISOMETRIC GEOMETRY -->
  <g transform="translate(0, 10)">
    
    <!-- 1. BOTTOM REAR-LEFT ARM (Arm 3) -->
    <polygon points="120,165 140,154 300,245 285,258" fill="url(#facetLeft)" stroke="#334155" stroke-width="1.2"/>
    <polygon points="120,178 140,167 300,258 285,271" fill="url(#facetRight)" stroke="#334155" stroke-width="1.2"/>
    <polygon points="120,165 120,178 285,271 285,258" fill="#CBD5E1" stroke="#334155" stroke-width="1.2"/>
    <!-- Motor Mount Plate Rear Left -->
    <ellipse cx="130" cy="160" rx="26" ry="15" fill="url(#facetTop)" stroke="#1E293B" stroke-width="1.5"/>
    <ellipse cx="130" cy="160" rx="7" ry="4" fill="#FFFFFF" stroke="#FF5000" stroke-width="1.5"/>
    <!-- 4-hole motor bolt pattern -->
    <circle cx="118" cy="153" r="2" fill="#1E293B"/>
    <circle cx="142" cy="153" r="2" fill="#1E293B"/>
    <circle cx="118" cy="167" r="2" fill="#1E293B"/>
    <circle cx="142" cy="167" r="2" fill="#1E293B"/>

    <!-- 2. BOTTOM REAR-RIGHT ARM (Arm 2) -->
    <polygon points="560,185 540,174 380,245 395,258" fill="url(#facetRight)" stroke="#334155" stroke-width="1.2"/>
    <polygon points="560,198 540,187 380,258 395,271" fill="url(#facetLeft)" stroke="#334155" stroke-width="1.2"/>
    <polygon points="560,185 560,198 395,271 395,258" fill="#CBD5E1" stroke="#334155" stroke-width="1.2"/>
    <!-- Motor Mount Plate Rear Right -->
    <ellipse cx="550" cy="180" rx="26" ry="15" fill="url(#facetTop)" stroke="#1E293B" stroke-width="1.5"/>
    <ellipse cx="550" cy="180" rx="7" ry="4" fill="#FFFFFF" stroke="#FF5000" stroke-width="1.5"/>
    <!-- 4-hole motor bolt pattern -->
    <circle cx="538" cy="173" r="2" fill="#1E293B"/>
    <circle cx="562" cy="173" r="2" fill="#1E293B"/>
    <circle cx="538" cy="187" r="2" fill="#1E293B"/>
    <circle cx="562" cy="187" r="2" fill="#1E293B"/>

    <!-- 3. CENTER BASE CHASSIS PLATE -->
    <polygon points="280,225 400,225 435,285 340,335 245,285" fill="url(#facetTop)" stroke="#1E293B" stroke-width="1.5"/>
    <polygon points="245,285 340,335 340,348 245,298" fill="url(#facetLeft)" stroke="#1E293B" stroke-width="1.5"/>
    <polygon points="340,335 435,285 435,298 340,348" fill="url(#facetRight)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Center Cutouts & Flight Controller 30.5x30.5 Mounting Holes -->
    <polygon points="310,245 370,245 385,275 340,300 295,275" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <ellipse cx="320" cy="260" rx="3" ry="2" fill="#FF5000"/>
    <ellipse cx="360" cy="260" rx="3" ry="2" fill="#FF5000"/>
    <ellipse cx="325" cy="285" rx="3" ry="2" fill="#FF5000"/>
    <ellipse cx="355" cy="285" rx="3" ry="2" fill="#FF5000"/>

    <!-- 4. FRONT-LEFT ARM (Arm 4) -->
    <polygon points="245,285 270,298 150,375 130,360" fill="url(#facetTop)" stroke="#1E293B" stroke-width="1.5"/>
    <polygon points="130,360 150,375 150,388 130,373" fill="url(#facetLeft)" stroke="#1E293B" stroke-width="1.5"/>
    <polygon points="150,375 270,298 270,311 150,388" fill="url(#facetRight)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Truss Cutouts for Weight Reduction -->
    <polygon points="165,360 200,338 210,345 175,367" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    <!-- Front Left Motor Mount -->
    <ellipse cx="140" cy="365" rx="28" ry="16" fill="url(#facetTop)" stroke="#1E293B" stroke-width="1.75"/>
    <ellipse cx="140" cy="365" rx="8" ry="5" fill="#FFFFFF" stroke="#FF5000" stroke-width="1.5"/>
    <circle cx="126" cy="358" r="2.5" fill="#1E293B"/>
    <circle cx="154" cy="358" r="2.5" fill="#1E293B"/>
    <circle cx="126" cy="372" r="2.5" fill="#1E293B"/>
    <circle cx="154" cy="372" r="2.5" fill="#1E293B"/>

    <!-- 5. FRONT-RIGHT ARM (Arm 1) -->
    <polygon points="435,285 410,298 530,375 550,360" fill="url(#facetTop)" stroke="#1E293B" stroke-width="1.5"/>
    <polygon points="410,298 530,375 530,388 410,311" fill="url(#facetLeft)" stroke="#1E293B" stroke-width="1.5"/>
    <polygon points="530,375 550,360 550,373 530,388" fill="url(#facetRight)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Truss Cutouts for Weight Reduction -->
    <polygon points="515,360 480,338 470,345 505,367" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    <!-- Front Right Motor Mount -->
    <ellipse cx="540" cy="365" rx="28" ry="16" fill="url(#facetTop)" stroke="#1E293B" stroke-width="1.75"/>
    <ellipse cx="540" cy="365" rx="8" ry="5" fill="#FFFFFF" stroke="#FF5000" stroke-width="1.5"/>
    <circle cx="526" cy="358" r="2.5" fill="#1E293B"/>
    <circle cx="554" cy="358" r="2.5" fill="#1E293B"/>
    <circle cx="526" cy="372" r="2.5" fill="#1E293B"/>
    <circle cx="554" cy="372" r="2.5" fill="#1E293B"/>

    <!-- 6. TOP CAMERA CAGE & BATTERY STANDOFFS -->
    <line x1="290" y1="230" x2="290" y2="185" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="390" y1="230" x2="390" y2="185" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="310" y1="295" x2="310" y2="250" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="370" y1="295" x2="370" y2="250" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- Top Plate (Floating Carbon Top Deck) -->
    <polygon points="280,185 400,185 425,240 340,285 255,240" fill="url(#facetTop)" stroke="#0F172A" stroke-width="1.5"/>
    <polygon points="255,240 340,285 340,292 255,247" fill="url(#facetLeft)" stroke="#0F172A" stroke-width="1.5"/>
    <polygon points="340,285 425,240 425,247 340,292" fill="url(#facetRight)" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Top Plate Battery Strap Slots & FPV Camera Bracket -->
    <polygon points="320,200 360,200 365,210 325,210" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    <polygon points="325,225 355,225 360,235 330,235" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
    
    <!-- FPV Camera Mount Bracket on Front -->
    <polygon points="325,270 355,270 350,300 330,300" fill="url(#facetTop)" stroke="#FF5000" stroke-width="1.5"/>
    <ellipse cx="340" cy="285" rx="6" ry="4" fill="#0F172A" stroke="#FF5000" stroke-width="1"/>
    
    <!-- Optical Center Datum Reticle -->
    <circle cx="340" cy="265" r="14" stroke="#FF5000" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
    <line x1="340" y1="245" x2="340" y2="285" stroke="#FF5000" stroke-width="1"/>
    <line x1="320" y1="265" x2="360" y2="265" stroke="#FF5000" stroke-width="1"/>
  </g>

  <!-- Technical Engineering Watermark -->
  <g transform="translate(460, 460)">
    <text x="0" y="0" font-family="'Space Grotesk', monospace" font-size="9" fill="#94A3B8" letter-spacing="1">DESIGN: 220mm TRUE-X QUADCOPTER</text>
    <text x="0" y="12" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" fill="#FF5000" letter-spacing="1">CALIBRATED INFILL: 100% SOLID</text>
  </g>
</svg>